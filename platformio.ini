; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; globals.cpp instancia providers do ESP32 — não compila em ambiente nativo.
; Os testes criam suas próprias instâncias de Device com mock providers.
build_src_filter = +<*> -<globals.cpp>
debug_tool = custom
debug_load_cmds =
debug_server =
build_flags =
  -std=c++17
  -I test
  -I test/providers
  -D UNITY_SUPPORT_64
  -D UNITY_INCLUDE_DOUBLE

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = gmag11/ESPNtpClient@^0.2.7
