; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_on_host
; globals.cpp instancia providers do ESP32 — não compila em ambiente nativo.
; Os testes criam suas próprias instâncias de Device com mock providers.
build_src_filter = +<*> -<globals.cpp>
extra_scripts =
  extra_scripts/coverage.py
  extra_scripts/ci.py
debug_tool = custom
debug_load_cmds =
debug_server =
build_flags =
  -std=c++17
  -I test/test_on_host
  -I test/test_on_host/mocks
  -D UNITY_SUPPORT_64
  -D UNITY_INCLUDE_DOUBLE
  --coverage
  -fprofile-abs-path
  -lgcov

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = gmag11/ESPNtpClient@^0.2.7

[env:esp32dev_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
test_filter = test_on_target
; globals.cpp define o device global — não necessário nos testes de integração.
build_src_filter = +<*> -<globals.cpp>
lib_deps = gmag11/ESPNtpClient@^0.2.7
