; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_on_host
extra_scripts =
  extra_scripts/coverage.py
  extra_scripts/ci.py
debug_tool = custom
; debug_load_cmds =
; debug_server =
build_flags =
  -std=c++17
  -I test/test_on_host
  -I test/test_on_host/mocks
  -D UNITY_SUPPORT_64
  -D UNITY_INCLUDE_DOUBLE
  --coverage
  -fprofile-abs-path
  -lgcov

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_build_src = yes
test_filter = test_on_target
lib_deps = gmag11/ESPNtpClient@^0.2.7
